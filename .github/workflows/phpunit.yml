name: PHPUnit

on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml
      - name: Install deps
        run: composer install --no-progress --no-suggest --prefer-dist
      - name: Run tests
        run: vendor/bin/phpunit -v
